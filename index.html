<title>Ashen March</title>
<style>
  :root { --bg:#0e0d0b; --panel:#17150f; --line:#3a3326; --ink:#cdc3aa; --dim:#8a8170; --blood:#8a2b1e; --gold:#b9a773; }

  .loadline { height: 4px; background: #17140f; border: 1px solid #3a3326; margin: 12px 0 16px; } .loadline i { display: block; height: 100%; width: 0; background: #b9a773; transition: width .15s; }

  .warn { color: #d9877a !important; }

  button:hover:not(:disabled) { background: #332b1c; border-color: var(--gold); }

  button.on { border-color: var(--gold); color: var(--gold); }
  button.big { font-size: 17px; padding: 11px 26px; background: #3a1a14; border-color: var(--blood); letter-spacing: .08em; }
  button.big:hover:not(:disabled) { background: #55241a; }
  button.small { font-size: 13px; padding: 3px 10px; }
  button.danger { margin-top: 18px; border-color: var(--blood); }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; } .btnrow.center { justify-content: center; }
  /* going up together: the party screen */

  #partybox .card { border: 1px solid var(--line); background: var(--panel); max-width: 560px; width: min(560px, 96vw); } #partybox .card p { margin: 8px 0; } #partybox h1 { color: #d8cfb8; font-size: 26px; }

    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 40px 40px; }
  .item { position: absolute; background: #2a251a center/100% 100% no-repeat; outline: 1px solid #5a4f3a; outline-offset: -1px; cursor: grab; }
  .item:hover { background-color: #3a3222; }

  .item .dur { position: absolute; left: 0; bottom: 0; height: 3px; background: #7f9a5a; }

  .item .ins { position: absolute; right: 2px; top: 2px; width: 6px; height: 6px; border-radius: 50%; background: #6a9ac8; }

  .two { display: flex; gap: 14px; }

  #tip { position: fixed; z-index: 95; pointer-events: none; max-width: 290px; background: #0c0b08; border: 1px solid var(--line); padding: 8px 11px; font-size: 13px; }
  #tip b { color: var(--gold); font-weight: normal; font-size: 15px; } #tip i { color: var(--dim); } .firT { color: #b8c79a; } .insT { color: #8ab0d8; }
  #ctx { position: fixed; z-index: 96; background: #0c0b08; border: 1px solid var(--gold); min-width: 170px; }
  #ctx .opt { padding: 6px 14px; cursor: pointer; } #ctx .opt:hover { background: #332b1c; }
  #toast { position: fixed; z-index: 99; left: 50%; bottom: 90px; transform: translateX(-50%); background: #0c0b08; border: 1px solid var(--line); padding: 8px 18px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 70vw; text-align: center; }
  #toast.on { opacity: 1; }

  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; } .tabs.sub2 button { font-size: 13px; padding: 4px 10px; }
  .note { border-left: 3px solid var(--blood); padding: 6px 12px; margin-bottom: 12px; font-style: italic; color: #c9a99a; }
  .sellbox { border: 1px dashed var(--gold); color: var(--dim); text-align: center; padding: 14px; margin: 8px 0; }
  .row { display: flex; align-items: center; gap: 10px; padding: 3px 0; border-bottom: 1px solid #221e15; }
  .row .nm { flex: 1; } .row .pr { color: var(--dim); font-size: 12px; text-align: right; } .row.locked { opacity: .45; }
  .task { border: 1px solid var(--line); padding: 10px 14px; margin-bottom: 10px; } .task h3 { margin: 0 0 4px; color: var(--gold); font-size: 15px; text-transform: none; }
  .task.done { opacity: .5; } .task.ready { border-color: #7f9a5a; } .task .prog { color: #b8c79a; margin: 2px 0; font-size: 14px; } .task .prog.todo { color: var(--ink); }
  .task button, #colRight .scroll > button { margin: 6px 0; }
  .cond .crow, .xp .crow { display: flex; align-items: center; gap: 10px; font-size: 13px; margin: 2px 0; } .cond .crow span { flex: 0 0 76px; color: var(--dim); }
  .bar { flex: 1; height: 7px; background: #0c0b08; border: 1px solid #2a251a; } .bar i { display: block; height: 100%; background: #7f9a5a; }
  .bar.red i { background: #a8402e; } .bar.amber i { background: #b08a3a; } .bar.gold i { background: var(--gold); } .bar.food i { background: #8a7a4a; } .bar.water i { background: #5a7a8a; }
  .skill { margin-bottom: 9px; } .skill b { font-weight: normal; color: var(--ink); } .skill .bar { margin: 3px 0; }
  .xp { max-width: 300px; margin: 0 auto; } .xp .crow span:first-child { flex: 1; text-align: left; } .xp .tot { border-top: 1px solid var(--line); padding-top: 3px; color: var(--gold); } .lvl { color: var(--gold) !important; }
  .jday { color: var(--gold); margin-top: 10px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; } .jline { font-style: italic; color: #c2b8a0; margin: 3px 0 5px; }
  .settings .set { display: flex; align-items: center; gap: 12px; margin: 6px 0; } .savebox { width: 100%; height: 70px; background: #0c0b08; color: var(--dim); border: 1px solid var(--line); font: 11px monospace; user-select: text; resize: vertical; } .settings .nm { flex: 0 0 150px; } .settings input { flex: 1; accent-color: #b9a773; } .settings .pr { flex: 0 0 52px; text-align: right; color: var(--dim); }
  .found { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; } .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); padding: 2px 9px 2px 4px; font-size: 13px; } .chip i { width: 24px; height: 24px; background: center/contain no-repeat; }
  .choice { border: 1px solid var(--line); padding: 7px 12px; margin-bottom: 6px; cursor: pointer; } .choice:hover { border-color: var(--gold); } .choice.on { border-color: var(--gold); background: #2a2416; } .choice b { font-weight: normal; color: var(--gold); }
  .chk { font-size: 14px; margin: 3px 0; } .chk.ok { color: #a9b88c; }

  #raidinv { position: fixed; z-index: 20; inset: 0; display: flex; justify-content: center; align-items: center; gap: 18px; pointer-events: none; }
  #raidinv section { pointer-events: auto; background: rgba(18,16,11,.94); max-height: 90vh; }
  #rChar { width: 292px; } #rLoot { width: 240px; min-height: 240px; } #rLoot button { margin-bottom: 8px; align-self: flex-start; }
  .searching { animation: pulse 1s infinite; } @keyframes pulse { 50% { opacity: .35; } }

  #brief { position: fixed; inset: 0; z-index: 25; display: flex; gap: 18px; align-items: center; justify-content: center; background: rgba(8,7,6,.94); padding: 20px; }
  #brief section { max-height: 94vh; } #brief section:last-child { width: 460px; }
  #brief canvas { position: static; display: block; width: min(516px, 42vw); height: auto; }
  #result, #title, #pause, #ask { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #ask { z-index: 60; background: rgba(6,5,4,.9); } #ask .card { border: 1px solid var(--line); background: var(--panel); max-width: 520px; } #ask .card p { margin: 8px 0; }
  #result { z-index: 30; background: #080706; } #pause { z-index: 35; background: rgba(6,5,4,.84); } #title { z-index: 40; background: radial-gradient(ellipse at 50% 20%, #241c14, #070605 75%); }
  .card { max-width: 580px; text-align: center; padding: 30px 40px; max-height: 96vh; overflow-y: auto; }
  .card h1 { font-size: 34px; letter-spacing: .12em; margin-bottom: 18px; color: #b8c79a; } .card h1.dead { color: #b0392a; }
  .card h3 { margin-top: 20px; } .card .sub { margin: 8px 0; } .card button.big { margin-top: 20px; }
  .card.wide { max-width: 700px; } .card.wide p { text-align: left; font-size: 16px; line-height: 1.6; } .card.wide h1 { letter-spacing: .34em; color: #d8cfb8; }
  #pause .card { text-align: left; max-width: 660px; } #pause h1 { text-align: center; color: #d8cfb8; }

  /* ---- narrow screens: the three columns of the Hollow slide sideways, one or two in view at a time */
  #ctx { max-height: 94vh; overflow-y: auto; max-width: min(330px, 94vw); } #ctx .tiphead { padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
  @media (max-width: 1150px) {
    header { gap: 10px 14px; padding: 7px 12px; flex-wrap: wrap; } header h1 { font-size: 17px; letter-spacing: .2em; } header .ttl span { display: none; }
    #coin { gap: 12px; flex-wrap: wrap; } #coin span { font-size: 14px; } #go { padding: 7px 16px; font-size: 15px; }
    main { padding: 8px; gap: 8px; scroll-snap-type: x proximity; } main section { scroll-snap-align: start; padding: 10px 12px; } #colRight { min-width: min(380px, 94vw); }
    .card { padding: 16px 18px; } .card h1 { font-size: 26px; margin-bottom: 12px; } .card.wide h1 { letter-spacing: .2em; } .card.wide p { font-size: 15px; line-height: 1.5; }
    #brief { align-items: flex-start; justify-content: flex-start; overflow: auto; padding: 8px; gap: 8px; } #brief section { max-height: none; flex: none; } #brief section:last-child { width: min(460px, 94vw); }
    #brief canvas { width: min(516px, 44vw, 78vh); }
    #raidinv { gap: 8px; } #raidinv section { max-height: 96vh; padding: 10px 12px; }
  }
  @media (max-width: 640px) and (orientation: portrait) { #brief { flex-direction: column; } #brief section { max-width: 100%; } #brief canvas { width: min(516px, 80vw); } #raidinv { flex-direction: column; overflow-y: auto; pointer-events: auto; justify-content: flex-start; padding: 8px 0; } #raidinv section { max-height: none; flex: none; } }

  /* ---- depth: panels that sit on the page, things that answer the hand, and marks that say what a thing is worth */
  main section { box-shadow: 0 10px 28px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,240,200,.035); background-image: linear-gradient(180deg, rgba(255,240,200,.022), transparent 120px); }
  main section h2, #brief h2 { padding-bottom: 6px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, rgba(185,167,115,.07), transparent 70%); }
  button { transition: background-color .12s, border-color .12s, color .12s, transform .06s; } button:active:not(:disabled) { transform: translateY(1px); }
  .tabs button.on { box-shadow: inset 0 -2px 0 var(--gold); }
  .grid { box-shadow: inset 0 0 18px rgba(0,0,0,.55); }
  .item { box-shadow: inset 0 0 0 1px rgba(0,0,0,.35), inset 0 -10px 14px -10px rgba(0,0,0,.6); transition: background-color .1s, filter .15s, opacity .15s; }
  .item.fine { outline-color: #7f8f6a; } .item.rich { outline-color: #b9a773; box-shadow: inset 0 0 0 1px rgba(0,0,0,.35), inset 0 0 12px rgba(185,167,115,.22); }
  .item .want { position: absolute; right: 0; bottom: 0; width: 0; height: 0; border-style: solid; border-width: 0 0 11px 11px; border-color: transparent transparent #d9c27a transparent; }
  .item.dim { opacity: .22; filter: saturate(.3); } .item.dim:hover { opacity: .6; }
  .slot { box-shadow: inset 0 0 12px rgba(0,0,0,.6); } .slot:hover { border-color: #5a4f3a; }
  #tip { box-shadow: 0 8px 26px rgba(0,0,0,.7); border-color: #4a4232; line-height: 1.5; max-width: 320px; }
  #tip b.fine, .tiphead b.fine { color: #b8c79a; } #tip b.rich, .tiphead b.rich { color: #d9c27a; }
  #tip .kind, .tiphead .kind { float: right; margin-left: 14px; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  #tip .vs, .tiphead .vs { display: block; margin: 3px 0; padding: 3px 0; border-top: 1px solid #2a251a; border-bottom: 1px solid #2a251a; color: #a89f8a; }
  .up { color: #9fc27a; } .down { color: #d9877a; }
  #tip .use, .tiphead .use { display: block; color: #a89f8a; } .wantT { color: #d9c27a; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 2px 0 8px; } .chips .sub { margin-left: auto; }
  button.chip { font-size: 12px; padding: 2px 9px; border-radius: 10px; background: #14120d; } button.chip.on { background: #2a2416; border-color: var(--gold); color: var(--gold); }
  .loadbar { position: relative; height: 5px; background: #100f0b; border: 1px solid var(--line); margin: 3px 0 9px; } .loadbar i { position: absolute; left: 0; top: 0; bottom: 0; background: #7f9a5a; } .loadbar i.amber { background: #b9a773; } .loadbar i.red { background: #a8402e; } .loadbar b { position: absolute; top: -3px; bottom: -3px; width: 1px; background: #d8cfb8; }
  .sheet { margin: 2px 0 10px; padding: 7px 9px; background: rgba(0,0,0,.22); border: 1px solid #2a251a; } .sheet .sub { margin-top: 5px; font-size: 12px; }
  .prot { display: grid; grid-template-columns: 1fr 46px 46px 46px; gap: 2px 6px; font-size: 12px; align-items: center; }
  .prot .hd { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; text-align: center; } .prot .nm { color: #a89f8a; }
  .prot .pv { position: relative; text-align: center; color: #cdc3aa; background: #100f0b; line-height: 17px; overflow: hidden; } .prot .pv i { position: absolute; left: 0; bottom: 0; height: 2px; background: #7f9a5a; } .prot .pv.hi { color: #cfe0b0; } .prot .pv.no { color: #5a5244; }
  .hist { display: grid; gap: 2px; font-size: 13px; margin-bottom: 6px; }
  .hrow { display: grid; grid-template-columns: 54px 1.4fr 1.3fr 52px 70px 62px; gap: 6px; padding: 3px 7px; background: rgba(0,0,0,.2); border-left: 2px solid #7f9a5a; } .hrow.bad { border-left-color: #8a2b1e; color: #a89f8a; } .hrow span:last-child { text-align: right; }

  .card { box-shadow: 0 0 0 1px rgba(0,0,0,.4); } #result .card, #ask .card, #partybox .card, #pause .card { box-shadow: 0 18px 60px rgba(0,0,0,.7); }
  @media (max-width: 1150px) { .hrow { grid-template-columns: 48px 1fr 1fr 44px; } .hrow span:nth-child(5), .hrow span:nth-child(6) { display: none; } }
</style>

<body>
<canvas id="cv"></canvas>
<canvas id="hud"></canvas>

    <div class="ttl"><h1>ASHEN MARCH</h1><span>the Hollow, beneath the Burnt Hart</span></div>
    <div id="coin"></div>
    <button id="party" class="small">Party</button>
    <button id="go" class="big">Go up</button>
  </header>
  <main>
    <section id="colChar"></section>
    <section id="colStash"></section>
    <section id="colRight"></section>
  </main>
</div>
<div id="raidinv" class="hidden"><section id="rChar"></section><section id="rLoot"></section></div>
<div id="brief" class="hidden"></div>
<div id="result" class="hidden"></div>

<div id="partybox" class="hidden"></div>
<div id="ask" class="hidden"></div>
<div id="ctx" class="hidden"></div><div id="tip" class="hidden"></div><div id="ghost" class="hidden"></div><div id="toast"></div>
